<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache"><title>UULA Toolkit</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>body{margin:0;font:14px -apple-system,'Segoe UI',sans-serif;color:#5d6878;display:grid;place-items:center;height:100vh}</style>
</head><body>…
<script>
// always open the newest version (no waiting for cached copies after an update):
// a tool's own ribbon button (?tool=<id>) opens that tool, the UULA Toolkit button opens the tools list, "أدوات أخرى" (?more=1) the tools without a ribbon button
(function(){ var done=false, t=(location.search.match(/[?&]tool=([a-z0-9-]+)/)||[])[1], more=/[?&]more=1/.test(location.search);
  var go=function(){ if(done) return; done=true; location.replace((t ? 'tools/'+t+'/app.html?' : more ? 'index.html?more=1&' : 'index.html?')+'v='+Date.now()); };
  try { if (window.Office && Office.onReady) Office.onReady(go); else go(); } catch(e){ go(); }
  setTimeout(go, 3000); })();
</script></body></html>
