<style>
/* لوحة جانبية ضيقة: معاينة في الأعلى، ثم أقسام قابلة للطي، وشريط أزرار ثابت في الأسفل */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --fg:#16202d; --muted:#5b687a; --line:#dde2ea;
  --accent:#1f5fbf; --accent-fg:#ffffff; --danger:#b8372b; --ok:#1d7a4f;

  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
.preview[data-theme="dark"]{

  --accent:#6d9cf0; --accent-fg:#0b1222; --danger:#ef7a6e; --ok:#5cc596;
  --ch1:#202733; --ch2:#191f28; color-scheme:dark }
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px 16px;display:flex;flex-direction:column;gap:6px}
.pv-wrap{display:flex;flex-direction:column}
.pv-box{position:relative}
.preview{cursor:grab;touch-action:none;user-select:none}
.preview.drag{cursor:grabbing}
.insbtn{position:absolute;left:6px;bottom:6px;z-index:3;width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg,#fff);cursor:pointer;box-sizing:border-box}
.insbtn:hover{filter:brightness(1.08)}
#cropBtn{position:absolute;left:40px;bottom:6px;z-index:3;width:28px;height:28px;border-radius:7px;padding:0;display:inline-flex;align-items:center;justify-content:center}

.insbtn.part{width:34px;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px #1f71de}
.preview.cropping,.preview.cropping *{cursor:crosshair}

.bar{display:none!important}
.pv-tools{position:absolute;top:6px;left:6px;bottom:40px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;pointer-events:none}
.pv-tools>*{pointer-events:auto}
.imenu .tbt{opacity:.55}
.imenu .tbt.on{opacity:1;background:var(--accent);color:#fff;border-color:var(--accent)}
.imenu .fset{display:inline-flex;align-items:center;gap:3px;padding:2px 4px;border:1px solid var(--line);border-radius:7px}

.tmenu{flex-wrap:wrap;gap:3px!important;direction:ltr}
.tmenu .tq{width:24px!important;min-width:24px;height:24px!important;padding:0!important;margin:0;display:inline-flex!important;align-items:center;justify-content:center;border:1px solid var(--line)!important;border-radius:6px!important;background:var(--panel)!important;color:var(--fg);position:relative;flex:none;cursor:pointer;box-sizing:border-box}
.tmenu .tq:hover{border-color:var(--accent)!important}
.tmenu label.tq:has(input:checked){background:var(--accent)!important;color:#fff;border-color:var(--accent)!important}
.tmenu .tq .cbar{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.cur-tools .tmenu .tq.none,.imenu.tmenu .tq.none{background:var(--panel)!important;border:1px solid var(--line)!important}
.tmenu .tq.none .cbar{background:linear-gradient(135deg,transparent 40%,#e05a4f 40%,#e05a4f 60%,transparent 60%),#fff!important}
.tmenu .tq svg{margin-top:-3px;width:13px;height:13px}
.wico{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;pointer-events:none}.wico b{font:700 9px/1 Arial,Helvetica,sans-serif}
.cur-tools.cmp .grp.xtra{display:flex!important;flex-wrap:wrap!important;width:100%;gap:3px!important}
.cur-tools.cmp{padding:5px;width:90px;max-width:none}
.cur-tools.cmp .grp,.cur-tools.cmp .fset,.cur-tools.cmp .ends2{gap:3px!important;margin:0!important}
.cur-tools.cmp .ends2{display:inline-flex}
.cur-tools.cmp label.tgi,.cur-tools.cmp button.cy,.cur-tools.cmp .cbtn{margin:0!important;box-sizing:border-box}
.cur-tools.cmp .fset:has(input.mini),.cur-tools.cmp .imenu>.grp:has(input.mini){order:10}
.cur-tools.cmp .fset{flex-wrap:wrap}
.cur-tools.cmp .imenu{direction:ltr;flex-wrap:wrap;gap:3px;border:0;margin:0;padding:0;justify-content:flex-start}
.cur-tools.cmp .imenu+.imenu{margin-top:3px}
.cur-tools.cmp .grp,.cur-tools.cmp .fset{padding:0!important;border:0!important;gap:2px;flex:none!important;min-width:0!important}
.cur-tools.cmp button.cy,.cur-tools.cmp label.tgi,.cur-tools.cmp button.ic,.cur-tools.cmp .cbtn:not(.sm){width:24px!important;min-width:24px;height:24px!important;padding:0;border-radius:6px}

.cur-tools.cmp .grp>svg{width:14px;height:14px}
.cur-tools.cmp .axend{display:flex;gap:3px;order:-1;width:100%;justify-content:space-between;padding-bottom:4px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.cur-tools.cmp .imenu+.imenu{border-top:1px solid var(--line)!important;padding-top:4px!important}
.cur-tools.cmp .fset .grp,.cur-tools.cmp .grp:has(input.mini){width:100%}
.cur-tools.cmp .grp:has(input.mini){display:flex!important;box-sizing:border-box;gap:4px}
.cur-tools.cmp .grp:has(input.mini) input.mini{flex:1 1 auto;width:0!important;min-width:0!important;text-align:center;box-sizing:border-box}
.cur-tools.cmp{box-sizing:border-box}
.cur-tools.cmp .fset:has(input.mini){width:100%!important;display:flex!important}
.cur-tools.cmp .grp:has(input.mini){width:100%!important;flex:1 1 100%!important}
.cur-tools.txp{padding:4px;width:max-content;max-width:calc(100% - 8px)}
.cur-tools.txp button.ic{width:24px;height:24px}
.cur-tools.txp .tmenu .axend{display:inline-flex;gap:3px;margin-inline-start:4px}
.imenu .cbtn.none,.cur-tools .cbtn.none{background:linear-gradient(135deg,transparent 45%,#e05a4f 45%,#e05a4f 55%,transparent 55%),var(--panel)!important;border:1px solid var(--line)}
.imenu .cbtn.sm{width:16px;height:16px;border-radius:50%}
.imenu.r2{border-top:1px dashed var(--line);padding-top:5px;margin-top:2px}
.imenu input.mini{width:38px;height:24px;font-size:12px;text-align:center;margin-inline-start:2px;padding:0 3px}
.imenu input.mini.w2{width:52px}
.imenu .grp svg{flex:none}
.spin.h{flex-direction:row;gap:2px}
.spin.h button{width:24px;height:22px}
#params{display:flex;flex-direction:column;gap:4px;margin-top:6px}
#params:empty{display:none}
.prm{display:flex;align-items:center;gap:6px;direction:ltr;font-size:13px}
.prm i{font-family:"Times New Roman",serif;font-size:16px;min-width:14px;text-align:center}
.prm input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.prm input[type=number]{width:46px;height:24px;font-size:12px;padding:0 3px;text-align:center}
.prm button{width:24px;height:24px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center}
.prm.lim input[type=number]{width:38px}
#hov.ar{font-family:inherit;direction:rtl;font-weight:600}
#hov.snap{border-color:var(--accent);font-weight:700}
#hov{position:absolute;pointer-events:none;font:12px/1.2 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap;direction:ltr;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#hovDot{position:absolute;pointer-events:none;box-sizing:border-box;width:12px;height:12px;border-radius:50%;margin:-6px 0 0 -6px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);z-index:5}
.cur-tools.qbar{padding:4px;max-width:calc(100% - 12px)}
.cur-tools.qbar .qrow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.cur-tools.qbar .grp{display:flex;align-items:center;gap:4px;margin:0}
.cur-tools.qbar .qsep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.cur-tools.qbar .cbtn,.cur-tools.qbar .cy,.cur-tools.qbar .tgi,.cur-tools.qbar .tq,.cur-tools.qbar .dd{width:28px!important;height:28px!important;min-width:28px;border-radius:6px!important;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cur-tools.qbar .cbtn{border-radius:6px!important}
.cur-tools.qbar label.tgi{position:relative;border:1px solid var(--line);background:var(--panel);cursor:pointer}

.cur-tools.qbar label.tgi:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gbar .gb#moveTool.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg,#fff)}
.topbar{flex-wrap:wrap;row-gap:6px}
.topbar .tsep{width:1px;height:20px;background:var(--line);margin:0 2px;align-self:center}
.topbar .tb.lang{font:700 11px/1 Arial,Helvetica,sans-serif;width:auto;min-width:28px;padding:0 6px}
.topbar .brand{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.topbar .brand .lg{flex:none;display:block}
.topbar .brand .bt{display:flex;flex-direction:column;justify-content:center;height:30px}
.topbar .brand b{display:block;color:#1f71de;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
.topbar .brand i{display:block;color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500;font-style:normal}
.gbar .gbarg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gbar .gsep{width:1px;height:22px;background:var(--line);margin:0 2px}
.gbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:relative;z-index:40}
.gbar .gg{position:relative}
.gbar .gb{position:relative;width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.gbar .gb.has::after{content:'';position:absolute;right:2px;bottom:2px;border-style:solid;border-width:0 0 5px 5px;border-color:transparent transparent var(--muted) transparent}

.gbar .gsub{display:none;position:absolute;top:calc(100% + 3px);left:0;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;z-index:41}

.gbar .gg:hover:not(.shut)>.gsub,.gbar .gg.open:not(.shut)>.gsub{display:block}
.gbar .gi{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border:0;background:none;border-radius:5px;cursor:pointer;color:var(--fg);font-size:12pt;text-align:left;white-space:nowrap}
.gbar .gi:hover{background:var(--bg)}

.gbar .gi.on svg{color:var(--accent)}
.cur-tools{position:absolute;z-index:16;max-width:min(320px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.cur-tools .imenu{border-top:none;margin-top:0;padding-top:0}
.cur-tools .ctop{display:flex;align-items:center;gap:4px;margin-bottom:4px;direction:ltr}
.cur-tools .ctop .ct{flex:1;font-family:var(--mono),'Cambria Math',serif;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur-tools button.ic{width:28px;height:28px;border-radius:6px;padding:0;display:flex;align-items:center;justify-content:center}
.lbl-tools{position:absolute;z-index:15;display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:2px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.lbl-tools .tb{width:24px;height:24px}
.tb{position:relative;width:26px;height:26px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);background:var(--panel);border:1px solid var(--line);opacity:.92;cursor:pointer;box-sizing:border-box;font-size:11px;flex:none}
.tb:hover{border-color:var(--accent);opacity:1}
.tb b{font-weight:600;font-size:10px;line-height:1}

.tb.tg input{position:absolute;opacity:0;width:0;height:0;margin:0}

.tb.tg:has(input:checked){color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}

.tb.ico .cbar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;border:1px solid var(--line)}

.tb.ico.none .cbar{background-color:#fff!important;background-image:conic-gradient(#ccd2db 25%,transparent 0 50%,#ccd2db 0 75%,transparent 0)!important;background-size:4px 4px!important}
.tsep{height:2px;width:26px;flex:none}
.pw{position:relative;display:block;width:26px;height:26px;flex:none}

.tb.on{border-color:var(--accent);color:var(--accent)}

.preview{border:1px solid var(--line);border-radius:6px;overflow:hidden;height:200px;display:flex;align-items:center;justify-content:center;
  background-color:var(--ch2);background-image:conic-gradient(var(--ch1) 25%,transparent 0 50%,var(--ch1) 0 75%,transparent 0);background-size:14px 14px}

/* ---------- تلميح فوري عند المرور ---------- */
(()=>{ const tip=$('tip'); let cur=null;
  const hide=()=>{ tip.hidden=true; cur=null; };
  document.addEventListener('pointerover',e=>{ if(e.pointerType==='touch') return;
    const el=e.target.closest&&e.target.closest('[title],[data-tip]'); if(!el){ hide(); return; }

    const t=el.dataset.tip; if(!t){ hide(); return; }
    if(el.closest('#preview svg')){ hide(); return; }
    cur=el; tip.textContent=L10(t); tip.style.direction=LANG==='en'?'ltr':'rtl'; tip.hidden=false;
    const r=el.getBoundingClientRect(), w=tip.offsetWidth, h=tip.offsetHeight;
    let L=r.left+r.width/2-w/2, T=r.bottom+6; L=Math.max(4,Math.min(innerWidth-w-4,L)); if(T+h>innerHeight-4) T=r.top-h-6;
    tip.style.left=L+'px'; tip.style.top=T+'px'; });
  document.addEventListener('pointerout',e=>{ if(cur&&!(e.relatedTarget&&cur.contains(e.relatedTarget))) hide(); });
  document.addEventListener('pointerdown',()=>setTimeout(()=>{ if(cur&&cur.hasAttribute('title')){ cur.dataset.tip=cur.getAttribute('title'); cur.removeAttribute('title'); } hide(); },0));
  addEventListener('scroll',hide,true);
})();

(()=>{ const ac=$('ac');
  const L=[
    ['sqrt','√','sqrt(','الجذر التربيعي'],['cbrt','∛','cbrt(','الجذر التكعيبي'],['root','ⁿ√','root(3, ','الجذر النوني'],
    ['abs','|x|','abs(','القيمة المطلقة'],['sin','sin','sin(','جيب'],['cos','cos','cos(','جيب تمام'],['tan','tan','tan(','ظل'],
    ['sec','sec','sec(','قاطع'],['csc','csc','csc(','قاطع تمام'],['cot','cot','cot(','ظل تمام'],
    ['arcsin','sin⁻¹','arcsin(','معكوس الجيب'],['arccos','cos⁻¹','arccos(','معكوس جيب التمام'],['arctan','tan⁻¹','arctan(','معكوس الظل'],
    ['ln','ln','ln(','اللوغاريتم الطبيعي'],['log','log','log(','اللوغاريتم العشري'],['exp','eˣ','exp(','الدالة الأسية'],
    ['floor','⌊x⌋','floor(','أكبر عدد صحيح'],['ceil','⌈x⌉','ceil(','أصغر عدد صحيح أكبر'],['sgn','sgn','sgn(','دالة الإشارة'],
    ['pi','π','π','باي'],
    ['segment','—','segment(','قطعة مستقيمة'],['line','↔','line(','مستقيم'],['ray','→','ray(','شعاع'],['vector','⃗','vector(','متجه'],['polygon','▱','polygon(','مضلع']
  ];
  let el=null, list=[], sel=0, moved=false, from=0, to=0;
  const hide=()=>{ ac.hidden=true; list=[]; el=null; };
  function show(inp){ const pos=inp.selectionStart; if(pos!==inp.selectionEnd){ hide(); return; }
    const m=/[A-Za-z]+$/.exec(inp.value.slice(0,pos)); if(!m||/[A-Za-z]/.test(inp.value[pos]||'')){ hide(); return; }
    const w=m[0].toLowerCase(); list=L.filter(o=>o[0].startsWith(w)&&o[0]!==w);
    if(!list.length){ hide(); return; }
    el=inp; from=pos-w.length; to=pos; sel=-1; moved=false;
    ac.innerHTML=list.map((o,i)=>`<div class="o" data-i="${i}" role="option"><span class="s">${o[1]}</span><span class="n"><b>${o[0].slice(0,w.length)}</b>${o[0].slice(w.length)}</span><span class="d">${L10(o[3])}</span></div>`).join('');

    if(ins.endsWith('(')&&v[to]==='(') ins=ins.slice(0,-1);

    inp.dispatchEvent(new Event('input',{bubbles:true})); }

  document.addEventListener('keydown',e=>{ if(ac.hidden||e.target!==el) return;
    if(e.key==='ArrowDown'){ sel=(sel+1+list.length)%list.length; moved=true; paint(); }
    else if(e.key==='ArrowUp'){ sel=sel<0?list.length-1:(sel-1+list.length)%list.length; moved=true; paint(); }

    else return;
    e.preventDefault(); e.stopImmediatePropagation(); },true);
  ac.addEventListener('pointerdown',e=>{ const d=e.target.closest('.o'); if(!d) return; e.preventDefault(); accept(+d.dataset.i); });
  ac.addEventListener('pointermove',e=>{ const d=e.target.closest('.o'); if(d&&+d.dataset.i!==sel){ sel=+d.dataset.i; moved=true; paint(); } });

  addEventListener('scroll',e=>{ if(!ac.contains(e.target)) hide(); },true);

(()=>{ const pv=$('preview'), g=$('grip'), MIN=120, MAX=()=>Math.max(260,innerHeight-120);

      '#tkTip{position:fixed;z-index:100000;pointer-events:none;background:#18212e;color:#fff;font:12px/1.55 "UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif;' +
      'padding:6px 10px;border-radius:7px;max-width:250px;box-shadow:0 6px 18px rgb(0 0 0 / .22);display:grid;gap:2px}' +
      '#tkTip[hidden]{display:none}#tkTip b{font-weight:600;font-size:12.5px}#tkTip span{color:#d4dae3}#tkTip .k{color:#9fb0c6;font-family:ui-monospace,Menlo,monospace;font-size:11px}' +
      // the tools\' own tooltips step aside, so there is one look everywhere
      '.tip:not(#tkTip),#tip{display:none!important}';

  function hide() { clearTimeout(timer); if (tip) tip.hidden = true; cur = null; }

    var label = el.dataset.tip || '';
    if (!r && label) r = labels[label] || null;
    var name = r && r.n ? (r.n[L] || r.n.ar) : label;

    if (M) { try { name = M.K(name); } catch (e) {} }

    var expl = r ? (r[L] || r.ar) : '';
    if (!name && !expl) { hide(); return; }
    tip.innerHTML = '';
    var b = document.createElement('b'); b.textContent = name; tip.appendChild(b);
    var sb = null; try { sb = M && el.dataset.ins && M.SB ? M.SB[el.dataset.ins] : null; } catch (e) {}
    if (sb) {
      var k = document.createElement('bdi'); k.className = 'k'; k.dir = 'ltr'; k.textContent = sb; tip.appendChild(k);
    }
    if (TOOL === 'math' && !expl && el.dataset.ins) expl = 'يُدرج في مكان المؤشر في مربع الكتابة.';
    if (expl) { var s = document.createElement('span'); s.textContent = expl; tip.appendChild(s); }
    var ex = null; try { ex = M ? M.TIPEX[label] : null; } catch (e) {}
    if (ex) {
      var x = document.createElement('span'); x.textContent = 'بالكتابة: ' + ex; x.style.unicodeBidi = 'plaintext'; tip.appendChild(x);
    }
    tip.dir = L === 'en' ? 'ltr' : 'rtl';
    tip.hidden = false;
    var er = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.max(6, Math.min(innerWidth - w - 6, er.left + er.width / 2 - w / 2));

    if (el.hasAttribute('title')) { var tt = el.getAttribute('title'); el.removeAttribute('title'); if (tt) el.dataset.tip = tt; }  // no browser tooltip

  document.addEventListener('pointerout', function (e) { if (cur && !(e.relatedTarget && cur.contains(e.relatedTarget))) hide(); }, true);
  document.addEventListener('pointerdown', hide, true);
  document.addEventListener('keydown', hide, true);
  window.addEventListener('scroll', hide, true);
  window.addEventListener('blur', hide);
})();
</script>
