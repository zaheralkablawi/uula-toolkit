<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>UULA Toolkit</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#18212e;--muted:#5d6878;--line:#d9dfe7;--accent:#1f71de;--accent-soft:#e7effc;
  --f:"UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
.wrap{padding:10px 14px 16px;display:grid;gap:10px}
header{display:flex;align-items:center;gap:8px;direction:rtl;padding-inline:13px}
h1{margin:0;display:flex;align-items:center;gap:7px;font-weight:500;direction:ltr;margin-left:auto}
h1 svg{width:30px;height:30px;flex:none}
h1 .bt{display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;height:30px}
h1 .root{color:#2072e0;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
h1 .sub{color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ib.updbtn{position:relative;color:#e8590c;border-color:#e8590c}
.updbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:#e8590c;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{50%{transform:scale(1.5);opacity:.5}}
.appmenu{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);padding:5px}
.menu button{display:block;width:100%;font:inherit;font-size:.86rem;text-align:start;background:none;border:0;border-radius:7px;padding:6px 10px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.list{display:grid;gap:8px}
.tool{display:flex;align-items:center;gap:11px;width:100%;font:inherit;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);cursor:pointer}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool svg.ic{width:32px;height:32px;flex:none}
.tool .tx{display:grid;min-width:0;flex:1}
.tool b{font-weight:600;font-size:.95rem;direction:ltr;text-align:right}
.tool small{color:var(--muted);font-size:.76rem;line-height:1.4}
.tool .go{width:14px;height:14px;flex:none;color:#9aa3b0}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em;text-align:center}
.modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 40px rgb(0 0 0 / .3)}
.mbox h3{margin:0 0 8px;font-size:1rem}.mbox p{margin:6px 0}
.mbox .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.mini{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:6px;padding:1px 8px;cursor:pointer}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow svg{width:24px;height:24px;flex:none}
.mrow b{flex:1;font-weight:600;font-size:.9rem;direction:ltr;text-align:right}
.sw{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:34px;height:20px;border-radius:10px;background:#c9d1dc;position:relative;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:right .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{right:16px}
.empty{text-align:center;color:var(--muted);font-size:.84rem;padding:14px 6px;border:1px dashed var(--line);border-radius:12px}
.empty button{font:inherit;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0}
.mnote{font-size:.76rem;color:var(--muted);margin:0 0 6px}
.credit{text-align:center;font-size:.72rem;color:var(--muted);padding:6px 0 0}
</style></head><body>
<div class="wrap">
  <header>
    <h1><img src="logo.png" alt="" width="30" height="30" style="display:block;flex:none"><span class="bt"><span class="root">UULA</span><span class="sub">Toolkit</span></span></h1>
    <button type="button" class="ib updbtn" id="updBtn" hidden data-i18n-title="update"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.2 3.2v3.5h-3.5"/></svg><span class="dot"></span></button>
    <div class="appmenu">
      <button type="button" class="ib" id="menuBtn" aria-expanded="false" data-i18n-title="menu"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" hidden>
        <button type="button" id="chkUpd" data-i18n="chkUpd"></button>
        <button type="button" id="toolsItem" data-i18n="manage"></button>
        <button type="button" id="langItem" data-i18n="langName"></button>
        <button type="button" id="aboutBtn" data-i18n="about"></button>
      </div>
    </div>
  </header>
  <div class="list" id="list"></div>
  <div class="status" id="status" role="status"></div>
  <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><button type="button" class="mini" id="modalX" style="margin-top:10px" data-i18n="close"></button></div></div>
  <footer class="credit" dir="ltr">By Zaher Alkablawi <span id="appVer"></span></footer>
</div>
<script>
/*MI*/
// UULA Toolkit — one icon set for every menu (same drawings as UULA Graph's menu: 24px grid, stroke 2)
var TK_ICONS = {
  upd: '<path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"/><path d="M20 20v-5h-5"/>',
  lang: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>',
  tools: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/>',
  new: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M12 11v6M9 14h6"/>',
  help: '<path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/>',
  keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>',
  news: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>'
};
var TK_MENU_CSS =
  '.tki{display:flex!important;align-items:center;gap:8px}' +
  '.tki::before{content:"";flex:none;width:15px;height:15px;background:currentColor;' +
  '-webkit-mask:var(--tki) center/contain no-repeat;mask:var(--tki) center/contain no-repeat}';
function tkIcon(el, name) {
  if (!el || !TK_ICONS[name]) return;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + TK_ICONS[name] + '</svg>';
  el.classList.add('tki');
  el.style.setProperty('--tki', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
}
/*MI-END*/
(function () {
'use strict';
const VER = '1.0';
const $ = id => document.getElementById(id);
// ---- texts in Arabic and English (only the words change, the layout stays the same) ----
const D = {
  ar: { langBtn: 'EN', langName: 'English', update: 'تحديث جديد', menu: 'القائمة', chkUpd: 'التحقق من التحديثات', about: 'حول الأداة', close: 'إغلاق', manage: 'إظهار وإخفاء الأدوات', manageNote: 'اختر الأدوات التي تظهر في القائمة. يُحفظ اختيارك على هذا الجهاز.', allHidden: 'كل الأدوات مخفية.', showAll: 'إظهار كل الأدوات',
        latest: 'لديك أحدث نسخة', noConn: 'لا يوجد اتصال', hasUpd: 'يوجد تحديث جديد',
        aboutHtml: '<p>كل أدوات علا للباوربوينت والوورد في مكان واحد. اختر الأداة من القائمة، وارجع للقائمة من زر "كل الأدوات" في أعلى الأداة.</p>' },
  en: { langBtn: 'ع', langName: 'العربية', update: 'New update', menu: 'Menu', chkUpd: 'Check for updates', about: 'About', close: 'Close', manage: 'Show and hide tools', manageNote: 'Choose which tools appear in the list. Your choice is saved on this device.', allHidden: 'All tools are hidden.', showAll: 'Show all tools',
        latest: 'You have the latest version', noConn: 'No connection', hasUpd: 'A new update is available',
        aboutHtml: '<p>All UULA tools for PowerPoint and Word in one place. Pick a tool from the list, and go back to the list with the "All tools" button at the top of the tool.</p>' }
};
let lang = 'ar';
try { lang = localStorage.getItem('tk-lang') === 'en' ? 'en' : 'ar'; } catch (e) {}
const T = k => D[lang][k];
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = T(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = T(e.dataset.i18nTitle); e.setAttribute('aria-label', e.title); });
  draw();
}
function setLang(l) { lang = l; try { localStorage.setItem('tk-lang', l); } catch (e) {} applyLang(); }
const C = '<circle cx="16" cy="16" r="12.5" fill="none" stroke="#1f71de" stroke-width="2.6"/>';
// ---- the tools list: to add a new tool, add one line here and put its page in tools/<id>/app.html ----
const TOOLS = [
  { id: 'restyle', name: 'Restyle', hosts: ['ppt', 'word'],
    desc: { ppt: 'تحويل الشرائح لستايل علا وقوالب المذكرة', word: 'تمييز أجزاء المذكرة لنقلها إلى الباوربوينت', ppt_en: 'Convert slides to UULA style and booklet templates', word_en: 'Tag booklet parts to move them to PowerPoint' },
    icon: C + '<rect x="10.5" y="9" width="11" height="14" rx="1.6" fill="#1f71de"/><path d="M13 12.5h6M13 15.5h6M13 18.5h3.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>' },
  { id: 'math', name: 'Arabic Math', hosts: ['ppt', 'word'],
    desc: { ppt: 'كتابة المعادلات العربية وإدراجها', ppt_en: 'Write and insert Arabic math equations' },
    icon: C + '<path d="M8.5 16.5l2.4 4.6 4.2-11.1h8.4" fill="none" stroke="#1f71de" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' },
  { id: 'graph', name: 'Graph', hosts: ['ppt', 'word'],
    desc: { ppt: 'رسم الدوال وإدراجها صورةً', ppt_en: 'Graph functions and insert them as images' },
    icon: C + '<path d="M9 16h14M16 9v14" stroke="#9aa3b0" stroke-width="1.4"/><path d="M10.5 9.5c2 9 9 9 11 0" fill="none" stroke="#1f71de" stroke-width="2.4" stroke-linecap="round"/>' },
  { id: 'dark', name: 'Dark', hosts: ['ppt'],
    desc: { ppt: 'تقسيم أوراق العمل وتحويلها إلى الوضع الداكن', ppt_en: 'Split worksheets and convert them to dark mode' },
    icon: C + '<path d="M16 3.5a12.5 12.5 0 0 1 0 25z" fill="#1f71de"/>' },
  { id: 'cover', name: 'Cover', hosts: ['ppt'],
    desc: { ppt: 'إدراج شريحة الغلاف من قالب فيديو علا', ppt_en: 'Insert the cover slide from the UULA video template' },
    icon: C + '<rect x="8.6" y="11" width="14.8" height="10" rx="1.6" fill="#1f71de"/><path d="M12 15h8M13.5 18h5" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>' }
];
let host = '';
let hidden = [];
try { hidden = JSON.parse(localStorage.getItem('tk-hidden')) || []; } catch (e) {}
const saveHidden = () => { try { localStorage.setItem('tk-hidden', JSON.stringify(hidden)); } catch (e) {} };
function desc(t) {
  const h = host === 'word' && t.desc.word ? 'word' : 'ppt', sfx = lang === 'en' ? '_en' : '';
  return t.desc[h + sfx] || t.desc['ppt' + sfx] || t.desc.ppt;
}
function draw() {
  const avail = TOOLS.filter(t => !host || t.hosts.includes(host));
  const list = avail.filter(t => !hidden.includes(t.id));
  if (!list.length) { $('list').innerHTML = '<div class="empty">' + T('allHidden') + ' <button type="button" id="showAll">' + T('showAll') + '</button></div>'; return; }
  $('list').innerHTML = list.map(t =>
    '<button type="button" class="tool" data-id="' + t.id + '"><svg class="ic" viewBox="0 0 32 32" aria-hidden="true">' + t.icon + '</svg>' +
    '<span class="tx"><b>' + t.name + '</b><small>' + desc(t) + '</small></span>' +
    '<svg class="go" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg></button>').join('');
}
$('list').addEventListener('click', e => {
  if (e.target.id === 'showAll') { hidden = []; saveHidden(); draw(); return; }
  const b = e.target.closest('.tool'); if (!b) return;
  location.href = 'tools/' + b.dataset.id + '/app.html?v=' + Date.now();
});

// ---- menu / about ----
const say = m => { $('status').textContent = m; if (m) setTimeout(() => { if ($('status').textContent === m) $('status').textContent = ''; }, 5000); };
function menu(o) { $('appMenu').hidden = !o; $('menuBtn').setAttribute('aria-expanded', String(o)); }
$('menuBtn').addEventListener('click', e => { e.stopPropagation(); menu($('appMenu').hidden); });
document.addEventListener('click', e => { if (!e.target.closest('.appmenu')) menu(false); });
$('modalX').addEventListener('click', () => { $('modal').hidden = true; });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').hidden = true; });
$('toolsItem').addEventListener('click', () => {
  menu(false);
  const avail = TOOLS.filter(t => !host || t.hosts.includes(host));
  $('modalT').textContent = T('manage');
  $('modalB').innerHTML = '<p class="mnote">' + T('manageNote') + '</p>' + avail.map(t =>
    '<label class="mrow"><svg viewBox="0 0 32 32" aria-hidden="true">' + t.icon + '</svg><b>' + t.name + '</b>' +
    '<input type="checkbox" class="sw" data-id="' + t.id + '"' + (hidden.includes(t.id) ? '' : ' checked') + '></label>').join('');
  $('modal').hidden = false;
});
$('modalB').addEventListener('change', e => {
  const c = e.target.closest('.sw'); if (!c) return;
  hidden = hidden.filter(x => x !== c.dataset.id); if (!c.checked) hidden.push(c.dataset.id);
  saveHidden(); draw();
});
$('aboutBtn').addEventListener('click', () => {
  menu(false);
  $('modalT').textContent = T('about');
  $('modalB').innerHTML = T('aboutHtml') +
    '<p class="foot" dir="ltr">Developed by <b>Zaher Alkablawi</b> · Version ' + VER + '<br>© 2026 UULA. All rights reserved.</p>';
  $('modal').hidden = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { menu(false); $('modal').hidden = true; } });

// ---- updates (same method as UULA Arabic Math) ----
(function () {
  const head = () => fetch('index.html?chk=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
    .then(r => r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null).catch(() => null);
  let base = null, last = 0;
  async function check(manual) {
    last = Date.now(); const t = await head();
    if (!base) { base = t; if (manual) say(T(t ? 'latest' : 'noConn')); return; }
    if (t && t !== base) { $('updBtn').hidden = false; if (manual) say(T('hasUpd')); }
    else if (manual) say(T(t ? 'latest' : 'noConn'));
  }
  head().then(t => { base = t; });
  setInterval(() => check(false), 60 * 60 * 1000);
  const soon = () => { if (Date.now() - last > 60 * 60 * 1000) check(false); };
  window.addEventListener('focus', soon);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) soon(); });
  $('updBtn').addEventListener('click', () => location.replace('index.html?v=' + Date.now()));
  $('chkUpd').addEventListener('click', () => { menu(false); check(true); });
})();

// ---- start ----
$('appVer').textContent = VER;
{ const st = document.createElement('style'); st.textContent = TK_MENU_CSS; document.head.appendChild(st);
  tkIcon($('chkUpd'), 'upd'); tkIcon($('toolsItem'), 'tools'); tkIcon($('langItem'), 'lang'); tkIcon($('aboutBtn'), 'about'); }
$('langItem').addEventListener('click', () => { menu(false); setLang(lang === 'ar' ? 'en' : 'ar'); });
applyLang();
if (window.Office && Office.onReady) Office.onReady(info => {
  host = info && info.host === Office.HostType.Word ? 'word' : info && info.host === Office.HostType.PowerPoint ? 'ppt' : '';
  draw();
});
})();
</script>
</body></html>
