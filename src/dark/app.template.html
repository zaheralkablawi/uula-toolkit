<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>/*TITLE*/</title>
<script>window.UD_MODE='/*MODE*/';</script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212e; --muted:#5d6878; --line:#d9dfe7;
  --accent:#2f6fde; --accent-soft:#e7effc; --ok:#1f8a4c; --warn:#b4541a; --err:#c62828;
  --f:"UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
[hidden]{display:none!important}
.wrap{padding:10px 14px 16px;display:grid;gap:10px}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;display:flex;align-items:center;gap:7px;font-weight:500;direction:ltr;margin-left:auto}
h1 svg{width:30px;height:30px;flex:none}
h1 .bt{display:flex;flex-direction:column;justify-content:center;height:30px}
h1 .root{color:#2072e0;font-size:14px;line-height:15px;font-weight:600;letter-spacing:.03em}
h1 .sub{color:#9aa3b0;font-size:13px;line-height:15px;font-weight:500}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:7px;cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ib.updbtn{position:relative;color:#e8590c;border-color:#e8590c}
.updbtn .dot{position:absolute;top:-3px;inset-inline-end:-3px;width:8px;height:8px;border-radius:50%;background:#e8590c;animation:updp 1.6s ease-in-out infinite}
@keyframes updp{50%{transform:scale(1.5);opacity:.5}}
.appmenu{position:relative}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);padding:5px}
.menu button{display:block;width:100%;font:inherit;font-size:.86rem;text-align:start;background:none;border:0;border-radius:7px;padding:6px 10px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.label{font-size:.78rem;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.84rem;height:32px;border:0;background:var(--panel);color:var(--muted);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.act{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-size:.95rem;font-weight:600;min-height:46px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:start}
.act svg{width:22px;height:22px;flex:none;color:var(--accent)}
.act small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.act:hover{border-color:var(--accent);background:var(--accent-soft)}
.act.dark{background:#101217;border-color:#101217;color:#fff}.act.dark svg{color:#ffe600}.act.dark small{color:#aab2c0}
.act.dark:hover{background:#1c2029}
.act:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cwrap{position:relative}
.colorbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);cursor:pointer}
.colorbtn .sw{width:20px;height:16px;border-radius:3px;border:1px solid rgb(0 0 0 / .25)}
.colorbtn[aria-expanded="true"]{border-color:var(--accent)}
.cpop{position:absolute;left:0;top:calc(100% + 4px);z-index:16;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgb(0 0 0 / .18);padding:8px;display:grid;gap:6px;direction:ltr}
.cpop .crow{display:grid;grid-template-columns:repeat(10,18px);gap:4px}
.cpop .ccol{display:grid;grid-template-columns:repeat(10,18px);column-gap:4px;row-gap:0}
.cpop .mine{display:flex;gap:6px;direction:rtl;justify-content:flex-start}
.cpop button.c{width:18px;height:16px;border:1px solid rgb(0 0 0 / .18);border-radius:2px;padding:0;cursor:pointer}
.cpop .mine button.c{width:24px;height:22px;border-radius:4px}
.cpop button.c:hover{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:1}
.cpop button.c.on{outline:2px solid var(--ink);outline-offset:1px}
.cpop .clab{font-size:.7rem;color:var(--muted);direction:rtl}
.cpop .more{font:inherit;font-size:.78rem;border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;direction:rtl;text-align:right}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:.84rem;cursor:pointer}
.mini{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:6px;padding:1px 8px;cursor:pointer}
.tog{display:flex;align-items:center;gap:6px;width:100%;padding:0;border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.tog svg{transition:transform .15s}.tog[aria-expanded="false"] svg{transform:rotate(90deg)}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em}
.res{display:grid;gap:4px;font-size:.84rem}
.res .ln{display:flex;gap:6px;align-items:baseline}
.res .ok{color:var(--ok)}.res .warn{color:var(--warn)}.res .err{color:var(--err)}
.res a{color:var(--accent);cursor:pointer;text-decoration:underline;unicode-bidi:isolate}
.note{font-size:.74rem;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .35);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;box-shadow:0 16px 40px rgb(0 0 0 / .3)}
.mbox h3{margin:0 0 8px;font-size:1rem}.mbox p{margin:6px 0}.mbox ul{margin:6px 0;padding-inline-start:1.2em}
.mbox .foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}

.seg4{grid-template-columns:repeat(4,1fr)}.seg4 button{font-size:.78rem}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs button{padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:16/9}
.thumbs button img{display:block;width:100%;height:100%;object-fit:cover}
.thumbs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tin{font:inherit;font-size:.88rem;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--panel);color:var(--ink)}
.tin:focus{outline:none;border-color:var(--accent)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e6eaf0;border-radius:10px;padding:3px;gap:3px}
.tabs button{font:inherit;font-size:.86rem;font-weight:600;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tabpage{display:grid;gap:10px}

.seg button{height:auto;min-height:32px;padding:4px 3px;line-height:1.25}
.seg3{grid-template-columns:repeat(3,1fr)}.seg3 button{font-size:.8rem}
.seg button:disabled{color:#b7bec9;cursor:not-allowed;background:var(--panel)}
.langbtn{font:600 .8rem var(--f);color:var(--muted)}
header{direction:rtl}

.tools3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.tool{display:grid;justify-items:center;gap:3px;font:inherit;font-size:.74rem;font-weight:600;line-height:1.25;padding:7px 4px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;text-align:center}
.tool svg{width:20px;height:20px;color:var(--accent)}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool:disabled{opacity:.5;cursor:default}
.linkbtn{font:inherit;font-size:.74rem;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;margin-inline-start:auto}
#s1Status:empty{display:none}
.credit{text-align:center;font-size:.72rem;color:var(--muted);padding:6px 0 0}
.step{display:flex;gap:9px;align-items:flex-start;padding:4px 0}
.step+.step{border-top:1px solid var(--line);padding-top:9px}
.circ{display:inline-grid;place-items:center;flex:none;width:1.65em;height:1.65em;border:1.5px solid var(--accent);border-radius:999px;color:var(--accent);font-size:.85rem;line-height:1;margin-top:2px}
.step.done .circ{background:var(--accent);color:#fff}
.sbody{display:grid;gap:3px;min-width:0}.sbody b{font-weight:600;font-size:.9rem}
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:3px}
.srow .mini{display:inline-flex;align-items:center;gap:5px;height:26px}
.chip{font-size:.76rem;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:#9fd6b5;background:#e9f7ef;color:var(--ok)}.chip.bad{border-color:#f3c09c;background:#fdf1e8;color:var(--warn)}
.darkcard{background:#101217;color:#e9edf3;border-radius:12px;padding:12px;display:grid;gap:9px;box-shadow:0 6px 18px rgb(16 18 23 / .25)}
.dhead{display:flex;align-items:center;gap:7px;font-size:.95rem}.dhead b{font-weight:600}
.dseg{border-color:#2b303b}.dseg button{background:#171a21;color:#9aa3b2}.dseg button+button{border-color:#2b303b}
.dseg button[aria-pressed="true"]{background:#262a33;color:#ffe600}
.dbtn{font:inherit;font-size:1rem;font-weight:700;height:44px;border:0;border-radius:10px;background:#ffe600;color:#101217;cursor:pointer}
.dbtn:hover{filter:brightness(1.05)}.dbtn:disabled{background:#2b303b;color:#6d7584;cursor:not-allowed;filter:none}
.dlock{font-size:.76rem;color:#9aa3b2;text-align:center}
.darkcard .status{color:#aab2c0}.darkcard .prog{background:#2b303b}.darkcard .prog i{background:#ffe600}
.darkcard .res a{color:#ffe600}.darkcard .res .ok{color:#6fd39a}.darkcard .res .warn{color:#f4b37a}.darkcard .res .err{color:#ff8a80}.darkcard .note{color:#9aa3b2}
body.m-dark .tabs,body.m-cover .tabs{display:none}
.gt2{font-size:.88rem;font-weight:600;color:var(--ink)}
#tTitle,#tSub{text-align:center}
</style></head><body>
<div class="wrap">
  <header>
    <h1><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#1f71de" stroke-width="2.6"/><path d="M16 3.5a12.5 12.5 0 0 1 0 25z" fill="#1f71de"/></svg><span class="bt"><span class="root">UULA</span><span class="sub">/*SUB*/</span></span></h1>
    <button type="button" class="ib updbtn" id="updBtn" hidden data-i18n-title="update"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.2 3.2v3.5h-3.5"/></svg><span class="dot"></span></button>
    <button type="button" class="ib langbtn" id="langBtn" data-i18n="langBtn" data-i18n-title="langName"></button>
    <div class="appmenu">
      <button type="button" class="ib" id="menuBtn" aria-expanded="false" data-i18n-title="menu"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" hidden data-i18n-dir>
        <button type="button" id="chkUpd" data-i18n="chkUpd"></button>
        <button type="button" id="langItem" data-i18n="langName"></button>
        <button type="button" id="aboutBtn" data-i18n="about"></button>
      </div>
    </div>
  </header>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-t="dark" aria-selected="true" data-i18n="tabDark"></button>
    <button type="button" role="tab" data-t="title" aria-selected="false" data-i18n="tabTitle"></button>
  </div>

  <div class="tabpage" id="pageDark">
  <section class="panel">
    <span class="label" data-i18n="stepsLabel"></span>
    <div class="step" id="step1">
      <span class="circ" data-i18n="n1"></span>
      <div class="sbody">
        <b data-i18n="s1Title"></b>
        <span class="note" data-i18n="s1Note"></span>
        <div class="tools3">
          <button type="button" class="tool" id="suggestSep"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h14"/><path d="M10 2.5l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z"/><path d="M15 13.5l.6 1.3 1.3.6-1.3.6-.6 1.3-.6-1.3-1.3-.6 1.3-.6z"/></svg><span data-i18n="suggestSep"></span></button>
          <button type="button" class="tool" id="addSep"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10h14"/></svg><span data-i18n="addSep"></span></button>
          <button type="button" class="tool" id="makePart"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="2" stroke-dasharray="3 2.2"/><path d="M7.5 10.2l1.8 1.8 3.4-3.6"/></svg><span data-i18n="makePart"></span></button>
        </div>
        <div class="srow">
          <label class="chk"><input type="checkbox" id="s1Done"> <span data-i18n="s1Done"></span></label>
          <button type="button" class="linkbtn" id="clearParts" data-i18n="clearParts"></button>
        </div>
        <div class="status" id="s1Status"></div>
      </div>
    </div>
    <div class="step" id="step2">
      <span class="circ" data-i18n="n2"></span>
      <div class="sbody">
        <b data-i18n="s2Title"></b>
        <span class="note" data-i18n="s2Note"></span>
        <div class="srow"><label class="chk"><input type="checkbox" id="s2Done"> <span data-i18n="s2Done"></span></label></div>
      </div>
    </div>
  </section>

  <section class="darkcard">
    <div class="dhead"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ffe600" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><b data-i18n="darkHead"></b></div>
    <div class="seg dseg" id="scope">
      <button type="button" data-v="sel" aria-pressed="false" data-i18n="scopeSel"></button>
      <button type="button" data-v="all" aria-pressed="true" data-i18n="scopeAll"></button>
    </div>
    <button type="button" class="dbtn" id="darkBtn" data-i18n="convert"></button>
    <div class="dlock" id="lockNote"></div>
    <div class="prog" id="prog" hidden><i></i></div>
    <div class="status" id="status" role="status"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="panel">
    <button type="button" class="tog" id="setTog" aria-expanded="false"><svg viewBox="0 0 12 12" width="10" height="10"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="settings"></span></button>
    <div id="setBody" hidden style="display:grid;gap:8px">
      <div class="row"><span data-i18n="bgColor"></span><span class="cwrap"><button type="button" class="colorbtn" data-k="bg"><span class="sw"></span></button></span></div>
      <div class="row"><span data-i18n="textColor"></span><span class="cwrap"><button type="button" class="colorbtn" data-k="text"><span class="sw"></span></button></span></div>
      <div class="row"><span data-i18n="accentColor"></span><span class="cwrap"><button type="button" class="colorbtn" data-k="accent"><span class="sw"></span></button></span></div>
      <label class="chk"><input type="checkbox" id="imgChk" checked> <span data-i18n="imgChk"></span></label>
      <div class="row"><span class="note" data-i18n="fontNote"></span><button type="button" class="mini" id="resetBtn" data-i18n="reset"></button></div>
    </div>
  </section>
  </div>

  <div class="tabpage" id="pageTitle" hidden>
  <section class="panel" id="titlePanel">
    <span class="gt2" data-i18n="coverHead"></span>
    <div class="seg seg4" id="tType">
      <button type="button" data-v="explain" aria-pressed="true" data-i18n="tExplain"></button>
      <button type="button" data-v="better" aria-pressed="false" data-i18n="tBetter"></button>
      <button type="button" data-v="bank" aria-pressed="false" data-i18n="tBank"></button>
      <button type="button" data-v="practice" aria-pressed="false" data-i18n="tPractice"></button>
    </div>
    <div class="thumbs" id="tThumbs"></div>
    <input type="text" class="tin" id="tTitle" data-i18n-ph="tTitlePh" dir="auto">
    <input type="text" class="tin" id="tSub" data-i18n-ph="tSubPh" dir="auto">
    <span class="label" data-i18n="posLabel"></span>
    <div class="seg seg3" id="tPos">
      <button type="button" data-v="start" aria-pressed="true" data-i18n="posStart"></button>
      <button type="button" data-v="before" aria-pressed="false" data-i18n="posBefore"></button>
      <button type="button" data-v="after" aria-pressed="false" data-i18n="posAfter"></button>
    </div>
    <div class="note" id="tSelNote" hidden data-i18n="tNeedSel"></div>
    <button type="button" class="act" id="tInsert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 10h8M10 14h4"/></svg><span data-i18n="tInsert"></span></button>
    <div class="status" id="tStatus"></div>
  </section>
  <section class="panel" id="innerPanel">
    <span class="gt2" data-i18n="innerHead"></span>
    <div class="thumbs" id="iThumbs"></div>
    <label class="chk"><input type="checkbox" id="iHead"> <span data-i18n="iHead"></span></label>
    <span class="label" data-i18n="posLabel"></span>
    <div class="seg seg3" id="iPos">
      <button type="button" data-v="end" aria-pressed="true" data-i18n="posEnd"></button>
      <button type="button" data-v="before" aria-pressed="false" data-i18n="posBefore"></button>
      <button type="button" data-v="after" aria-pressed="false" data-i18n="posAfter"></button>
    </div>
    <div class="note" id="iSelNote" hidden data-i18n="tNeedSel"></div>
    <button type="button" class="act" id="iInsert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10M7 12.5h10M7 16h6"/></svg><span data-i18n="iInsert"></span></button>
    <div class="status" id="iStatus"></div>
  </section>
  </div>

  <div class="cpop" id="cpop" hidden></div><input type="color" id="custom" class="vh" tabindex="-1" aria-hidden="true">
  <div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><button type="button" class="mini" id="modalX" style="margin-top:10px" data-i18n="close"></button></div></div>
  <footer class="credit" dir="ltr">By Zaher Alkablawi <span id="appVer">1.0</span></footer>
</div>
<script>/*I18N*/</script>
<script>/*JSZIP*/</script>
<script>/*ENGINE*/</script>
<script>/*APP*/</script>
</body></html>
